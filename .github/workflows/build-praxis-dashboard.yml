name: Build Praxis Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipad:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apply dashboard changes
        env:
          PATCH_DATA: 
        run: |
          python3 -c 'import base64,os;open("dashboard.patch","wb").write(base64.b64decode(os.environ["PATCH_DATA"]))'
          git apply dashboard.patch
      - name: Build iPad app
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -project src/Praxis.Panel.iOS/PraxisPanelIOS.xcodeproj -scheme PraxisPanelIOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/PraxisBuild" CODE_SIGNING_ALLOWED=NO build
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/PraxisBuild/Build/Products/Release-iphoneos/PraxisPanelIOS.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qry PraxisPanel-dashboard-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PraxisPanel-dashboard-unsigned
          path: ${{ runner.temp }}/package/PraxisPanel-dashboard-unsigned.ipa
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Apply dashboard changes
        env:
          PATCH_DATA: 
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('dashboard.patch', [Convert]::FromBase64String($env:PATCH_DATA))
          git apply dashboard.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows app
        run: dotnet publish src/Praxis.Core.Bluetooth/Praxis.Core.Bluetooth.csproj -c Release -r win-x64 --self-contained true -o dashboard-publish
      - uses: actions/upload-artifact@v4
        with:
          name: Praxis-Windows-dashboard
          path: dashboard-publish/
          if-no-files-found: error
