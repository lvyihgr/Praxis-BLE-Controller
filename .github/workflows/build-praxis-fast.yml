name: Build Praxis Fast Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipad:
    runs-on: macos-15
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Apply iPad changes
        env:
          PATCH_DATA: 
        run: |
          python3 -c 'import base64,gzip,os;open("desktop.patch","wb").write(gzip.decompress(base64.b64decode(os.environ["PATCH_DATA"])))'
          git apply --check desktop.patch
          git apply desktop.patch
      - name: Build iPad app
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -project src/Praxis.Panel.iOS/PraxisPanelIOS.xcodeproj -scheme PraxisPanelIOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/PraxisBuild" CODE_SIGNING_ALLOWED=NO build
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/PraxisBuild/Build/Products/Release-iphoneos/PraxisPanelIOS.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qry PraxisPanel-fast-unsigned.ipa Payload
      - name: Upload iPad app
        uses: actions/upload-artifact@v4
        with:
          name: PraxisPanel-fast-unsigned
          path: ${{ runner.temp }}/package/PraxisPanel-fast-unsigned.ipa
          if-no-files-found: error
