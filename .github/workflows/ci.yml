name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and self-test
        shell: pwsh
        run: .\scripts\test.ps1

  swift-codec:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test Praxis Link codec
        run: swift test --package-path src/Praxis.Panel.iOS
      - name: Build iPad app without signing
        run: >-
          xcodebuild
          -project src/Praxis.Panel.iOS/PraxisPanelIOS.xcodeproj
          -scheme PraxisPanelIOS
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
