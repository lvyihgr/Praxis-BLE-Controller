name: Feature request
description: Propose a focused improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: User problem
      description: Explain the workflow problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Compatibility considerations
      description: Note any Windows, iPadOS, Bluetooth or PowerPoint compatibility impact.
